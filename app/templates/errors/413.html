{% extends "base.html" %}
{% block title %}413 File Too Large{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">413</div>
  <h2 class="fw-bold mb-3" style="color:#1E1B4B;">File Too Large</h2>
  <p style="color:#6B7280;margin-bottom:28px;">The file you tried to upload exceeds the 25 MB limit.<br>Please compress or split your file and try again.</p>
  <a href="javascript:history.back()" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
</div>
{% endblock %}
{% block auth_content %}{% endblock %}
