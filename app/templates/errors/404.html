{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <h2 class="fw-bold mb-3" style="color:#1E1B4B;">Page Not Found</h2>
  <p style="color:#6B7280;margin-bottom:28px;">The page you're looking for doesn't exist or has been moved.</p>
  <a href="javascript:history.back()" class="btn me-2" style="background:#F5F3FF;color:#7C3AED;border:1.5px solid #DDD6FE;border-radius:10px;font-weight:600;"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
  <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Home</a>
</div>
{% endblock %}
{% block auth_content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;background:var(--cc-bg);">
  <div class="error-code">404</div>
  <h2 class="fw-bold mb-3" style="color:#1E1B4B;">Page Not Found</h2>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Go to Login</a>
</div>
{% endblock %}
